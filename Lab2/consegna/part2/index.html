<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metronome Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <header>
      <h1>🎵 Metronome Dashboard</h1>
      <p class="subtitle">Control your Raspberry Pi Metronome via REST API</p>
    </header>

    <section class="connection">
      <label for="host">Device address</label>
      <div class="row">
        <input type="text" id="host" placeholder="e.g. 192.168.8.189:8080" />
        <button id="connectBtn" class="btn btn-secondary">Save</button>
      </div>
      <span id="connStatus" class="status status-unknown">Not connected</span>
    </section>

    <section class="bpm-display">
      <div class="pulse-dot" id="pulseDot"></div>
      <div class="bpm-value" id="bpmValue">--</div>
      <div class="bpm-label">BPM</div>
      <button id="refreshBtn" class="btn btn-primary">⟳ Refresh</button>
    </section>

    <section class="bpm-set">
      <label for="bpmInput">Set new BPM</label>
      <div class="row">
        <input type="number" id="bpmInput" min="0" max="400" placeholder="e.g. 120" />
        <button id="setBtn" class="btn btn-primary">Set</button>
      </div>
      <input type="range" id="bpmSlider" min="0" max="240" value="0" />
    </section>

    <section class="bpm-bounds">
      <div class="bound">
        <span class="bound-label">Min BPM</span>
        <span class="bound-value" id="minValue">--</span>
        <button id="resetMinBtn" class="btn btn-secondary btn-small">Reset</button>
      </div>
      <div class="bound">
        <span class="bound-label">Max BPM</span>
        <span class="bound-value" id="maxValue">--</span>
        <button id="resetMaxBtn" class="btn btn-secondary btn-small">Reset</button>
      </div>
    </section>

    <p id="message" class="message"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
